# Lance tous les tests du dépôt à chaque envoi (push) et à chaque demande de fusion.
# Aucun secret n'est utilisé : les tests tournent sur des données inventées, sans réseau.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Intégration, pilotage, outils
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Aucun marqueur de conflit de fusion
        run: |
          if git grep -n -I -E '^(<<<<<<<|>>>>>>>) |^=======$'; then
            echo "Marqueur de conflit de fusion laissé dans le ou les fichiers ci-dessus."
            exit 1
          fi
      - name: Dépendances
        run: pip install -r requirements_test.txt

      # README § 7
      - name: Client et décodage
        run: pytest -p no:homeassistant -p no:socket tests/test_client_and_parser.py
      - name: Signature, garde-fous, écriture et relecture
        run: pytest -p no:homeassistant -p no:socket tests/test_pilotage.py
      - name: Intégration dans Home Assistant
        run: pytest tests/test_ha_integration.py
      - name: Assistant d'installation
        run: pytest -p no:homeassistant -p no:socket tests/test_installation.py
      - name: Évaluation des offres d'électricité
        run: pytest -p no:homeassistant -p no:socket tests/test_tarifs.py
      - name: Moteur du tarif dynamique
        run: pytest -p no:homeassistant tests/test_optimiseur.py
      - name: Dimensionnement
        run: pytest tools/dimensionnement/tests -q
      - name: Tableau de bord (sans navigateur)
        run: pytest -p no:homeassistant -p no:socket dashboard/tests -q

      # pilotage/README.md
      - name: Pilotage, calcul de nuit (v6 et v7)
        run: |
          python pilotage/tests/test_calcul.py
          python pilotage/tests/test_v7.py
      - name: Pilotage, scripts, automatisations, tarif dynamique, secours
        working-directory: pilotage/tests
        run: python -m pytest -q

  navigateur:
    # Rendu des cartes du tableau de bord dans Chrome. Facultatif : un échec ici ne bloque pas
    # la demande de fusion (téléchargement de Chrome, instabilité du rendu).
    name: Tableau de bord dans Chrome (facultatif)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Dépendances
        run: |
          pip install -r requirements_test.txt playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Rendu des cartes
        run: pytest -p no:homeassistant -p no:socket dashboard/tests -q -rs
