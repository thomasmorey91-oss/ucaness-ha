# =============================================================================
# Pilotage de nuit d'une batterie UCanpower (UHome) par l'intégration UCANESS
# -----------------------------------------------------------------------------
# MODE SIMULATION PAR DÉFAUT : la stratégie est calculée et journalisée chaque soir,
# AUCUNE consigne n'est envoyée à l'onduleur tant que « Batterie : mode simulation » est allumé.
# L'interrupteur revient à « allumé » à chaque redémarrage de Home Assistant (sécurité).
#
# Ce qui est envoyé à l'onduleur (actions ucaness.definir_plages_charge et
# ucaness.definir_mode, relues après envoi) : le mode (autoconsommation / arbitrage horaire)
# et les plages de CHARGE. Jamais de plage de décharge, jamais de mode Backup, aucun réglage
# de fond. L'option « Écriture autorisée » de l'intégration doit être cochée.
#
# Déroulement d'une nuit :
#   - 22h30 : calcul d'aperçu (journal) ;
#   - début des heures creuses : recalcul avec le SOC du moment ; si une recharge est utile,
#     plage de charge placée en FIN d'heures creuses (fin 15 min avant leur fin, durée + 10 %),
#     puis passage en arbitrage horaire ;
#   - 1 h avant le début de la charge : réévaluation (SOC et prévision du moment), la plage est
#     raccourcie, allongée ou supprimée ;
#   - 2 min avant la fin des heures creuses : retour en autoconsommation (secours 15 min après).
#   Une plage qui passe minuit est coupée en deux : début-23h59 puis 00h00-fin.
#   Constat sur un UHome 6K (modèle « mr ») : en arbitrage (« Peak Fill Mode »), hors plage,
#   la batterie continue d'alimenter la maison ; la consommation de la nuit est donc toujours
#   déduite du stock.
#
# Calcul v7 (pour le lendemain le soir, pour le jour même après minuit) :
#   - consommation heure par heure = consommation MESURÉE de la maison (moyenne horaire des
#     7 derniers jours, même type de jour si possible, statistiques de Home Assistant),
#     PONDÉRÉE par l'ancienneté (1 pour le jour le plus récent, 1/2 pour le précédent, 1/4…) ;
#     pour une heure sans mesure : « consommation journalière par défaut » × profil type ;
#   - solaire heure par heure = prévision Solcast (attribut detailedHourly), valeurs datées du
#     jour préparé seulement ; sans prévision pour ce jour : aucune recharge (repli sûr) ;
#   - de la fin des heures creuses à leur retour, bilan cumulé de la batterie : il baisse quand
#     la maison consomme plus que le solaire, il remonte avec le surplus ;
#     besoin = le point le plus bas de ce bilan (énergie à avoir en stock en fin de nuit pour
#     tenir jusqu'au relais du solaire, ou jusqu'aux heures creuses suivantes), plus le quart
#     d'heure entre la fin de la plage et la fin des heures creuses, majoré de la marge ;
#   - place = capacité utile - pic de remplissage atteint AVANT le point le plus bas (un stock
#     consommé avant le surplus solaire ne prend pas sa place) ;
#   - cible = min(besoin, place) ; stock restant = stock actuel - consommation de la nuit ;
#   - recharge réseau = (cible - stock restant) / rendement, si rendement² × prix HP > prix HC.
#   Pas de recharge si la batterie est sous 0 °C, si le jour préparé n'est pas ouvré (tarifs
#   « week-end en heures creuses »), ou si une donnée manque (repli sûr : rien n'est envoyé).
#
# Journal (v7) : chaque décision indique la fourchette solaire P10-P90, l'heure de la prévision,
# le nombre d'heures mesurées et si la batterie est remplie quelle que soit la prévision.
# Gain réel (v7) : chaque soir, coût réel des 24 dernières heures comparé à l'autoconsommation
# simple simulée avec les mêmes mesures ; cumuls du mois et de l'année.
# Solcast (v7, optionnel) : mises à jour pilotées par Jarvis, dont une avant la réévaluation.
#
# Réglages (Paramètres > Entrées) : capacité, plancher (SOC sous lequel l'onduleur ne
# décharge plus), rendement, puissance de charge réseau réellement observée, marge,
# consommation journalière par défaut. Voir pilotage/README.md.
#
# Entités attendues (à renommer à l'installation, voir pilotage/README.md) :
#   sensor.uhome_soc, sensor.uhome_temperature_batterie, sensor.uhome_mode,
#   sensor.uhome_puissance_maison, binary_sensor.uhome_temperature_hors_plage,
#   sensor.uhome_puissance_mppt_1, sensor.uhome_puissance_mppt_2, sensor.uhome_puissance_reseau,
#   sensor.uhome_soutirage_reseau_total (UCANESS)
#   sensor.solcast_pv_forecast_prevision_demain, sensor.solcast_pv_forecast_prevision_aujourdhui,
#   sensor.solcast_pv_forecast_derniere_interrogation_de_l_api, sensor.solcast_pv_forecast_limite_api,
#   sensor.solcast_pv_forecast_api_utilisee (Solcast, noms français)
#   binary_sensor.workday_sensor (Workday)
# =============================================================================

input_boolean:
  jarvis_mode_simulation:
    name: "Batterie : mode simulation (aucune consigne envoyée)"
    icon: mdi:test-tube
    initial: true   # sécurité : revient en simulation à chaque redémarrage
  jarvis_batterie_plan_actif:
    name: "Batterie : recharge de nuit programmée (arbitrage horaire en cours)"
    icon: mdi:battery-charging-medium
  jarvis_solcast_pilote:
    name: "Solcast : mises à jour pilotées par Jarvis"
    icon: mdi:weather-partly-cloudy

input_datetime:
  jarvis_batterie_fin_plan:
    name: "Batterie : fin de la recharge programmée"
    has_date: false
    has_time: true
  jarvis_batterie_reevaluation:
    name: "Batterie : réévaluation de la recharge (1 h avant)"
    has_date: false
    has_time: true

input_number:
  jarvis_batterie_capacite:
    name: "Batterie : capacité brute"
    min: 0
    max: 40
    step: 0.01
    unit_of_measurement: kWh
    mode: box
  jarvis_batterie_plancher:
    name: "Batterie : SOC plancher (100 - DOD)"
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "%"
    mode: box
  jarvis_batterie_rendement:
    name: "Batterie : rendement charge ou décharge"
    min: 0
    max: 100
    step: 0.5
    unit_of_measurement: "%"
    mode: box
  jarvis_batterie_puissance_charge:
    name: "Batterie : puissance de charge"
    min: 0.5
    max: 10
    step: 0.1
    unit_of_measurement: kW
    mode: box
  jarvis_batterie_marge:
    name: "Batterie : marge de sécurité sur le besoin"
    min: 0
    max: 50
    step: 1
    unit_of_measurement: "%"
    mode: box
  jarvis_conso_journaliere:
    name: "Batterie : consommation journalière par défaut (heures sans mesure)"
    min: 0
    max: 200
    step: 0.1
    unit_of_measurement: kWh
    mode: box

template:
  # ---------------------------------------------------------------------------
  # Calcul de la recharge de nuit (chaque soir à 22h30, ou sur l'événement
  # « jarvis_recalcul_batterie » pour un recalcul manuel).
  # ---------------------------------------------------------------------------
  - triggers:
      - trigger: time
        at: "22:30:00"
      - trigger: event
        event_type: jarvis_recalcul_batterie
    actions:
      # Jour à préparer : demain le soir, aujourd'hui après minuit (réévaluation de nuit).
      - variables:
          jour_cible: >
            {% set f = states('input_datetime.jarvis_hc_fin') %}
            {% set h_f = f[:2] | int(6) if f | regex_match('^\\d\\d:') else 6 %}
            {{ (now().date() if now().hour < h_f else (now() + timedelta(days=1)).date()) | string }}
      - action: workday.check_date
        target: { entity_id: binary_sensor.workday_sensor }
        data:
          check_date: "{{ jour_cible }}"
        response_variable: jour
      # Consommation réellement mesurée, moyenne horaire des 7 derniers jours.
      - action: recorder.get_statistics
        continue_on_error: true
        data:
          start_time: "{{ (now() - timedelta(days=7)).isoformat() }}"
          statistic_ids: [sensor.uhome_puissance_maison]
          period: hour
          types: [mean]
        response_variable: mesures
      - variables:
          demain: "{{ jour_cible }}"
          demain_ouvre: "{{ jour['binary_sensor.workday_sensor'].workday | default(false) }}"
          # Profil type (part de la journée par heure, 0 h à 23 h) : sert seulement pour les heures
          # sans mesure. Profil générique (pointes du matin et du soir), à remplacer au besoin.
          profils:
            ouvre: [0.030, 0.027, 0.025, 0.024, 0.024, 0.027, 0.045, 0.060, 0.050, 0.038, 0.033, 0.033, 0.040, 0.036, 0.032, 0.032, 0.038, 0.052, 0.066, 0.072, 0.068, 0.058, 0.048, 0.038]
            repos: [0.032, 0.028, 0.026, 0.025, 0.024, 0.025, 0.030, 0.038, 0.048, 0.050, 0.048, 0.046, 0.050, 0.044, 0.038, 0.036, 0.040, 0.050, 0.062, 0.068, 0.066, 0.056, 0.046, 0.038]
          conso_jour: >
            {% set c = states('input_number.jarvis_conso_journaliere') | float(0) %}
            {{ c if c > 0 else none }}
          # Consommation mesurée par heure (kWh), même type de jour en priorité ; none sans mesure.
          # Moyenne PONDÉRÉE (v7) : le jour retenu le plus récent compte 1, le précédent 1/2, puis
          # 1/4… (rang parmi les jours de même type, ou parmi tous les jours à défaut).
          conso_mesuree: >
            {% set st = mesures.statistics if (mesures is defined and mesures is mapping and 'statistics' in mesures) else {} %}
            {% set rows = st['sensor.uhome_puissance_maison'] if 'sensor.uhome_puissance_maison' in st else [] %}
            {% set nj = namespace(meme=[], tous=[]) %}
            {% for r in rows %}
              {% if r.mean is number %}
                {% set t = r.start | as_datetime | as_local %}
                {% set d = t.date() | string %}
                {% if d not in nj.tous %}{% set nj.tous = nj.tous + [d] %}{% endif %}
                {% if (t.weekday() < 5) == demain_ouvre and d not in nj.meme %}{% set nj.meme = nj.meme + [d] %}{% endif %}
              {% endif %}
            {% endfor %}
            {% set meme = nj.meme | sort(reverse=true) %}
            {% set tous = nj.tous | sort(reverse=true) %}
            {% set ns = namespace(v=[]) %}
            {% for h in range(24) %}
              {% set a = namespace(s1=0, n1=0, s2=0, n2=0) %}
              {% for r in rows %}
                {% if r.mean is number %}
                  {% set t = r.start | as_datetime | as_local %}
                  {% if t.hour == h %}
                    {% set d = t.date() | string %}
                    {% set w2 = 0.5 ** (tous.index(d)) %}
                    {% set a.s2 = a.s2 + w2 * r.mean %}
                    {% set a.n2 = a.n2 + w2 %}
                    {% if d in meme %}
                      {% set w1 = 0.5 ** (meme.index(d)) %}
                      {% set a.s1 = a.s1 + w1 * r.mean %}
                      {% set a.n1 = a.n1 + w1 %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {% set val = (a.s1 / a.n1 / 1000) if a.n1 > 0 else ((a.s2 / a.n2 / 1000) if a.n2 > 0 else none) %}
              {% set ns.v = ns.v + [(val | round(3)) if val is not none else none] %}
            {% endfor %}
            {{ ns.v }}
          # Prévision Solcast du jour préparé : seules comptent les valeurs datées de ce jour (v7).
          capteur_pv: >
            {{ 'sensor.solcast_pv_forecast_prevision_aujourdhui' if jour_cible == now().date() | string else 'sensor.solcast_pv_forecast_prevision_demain' }}
          # Production solaire prévue heure par heure (kWh) : médiane (pv_estimate).
          pv_h: >
            {% set dh = state_attr(capteur_pv, 'detailedHourly') or [] %}
            {% set ns = namespace(v=[]) %}
            {% for h in range(24) %}
              {% set n2 = namespace(s=0) %}
              {% for e in dh %}
                {% set t = e.period_start | as_datetime | as_local %}
                {% if t.date() | string == jour_cible and t.hour == h %}
                  {% set n2.s = n2.s + (e.pv_estimate | float(0)) %}
                {% endif %}
              {% endfor %}
              {% set ns.v = ns.v + [n2.s | round(3)] %}
            {% endfor %}
            {{ ns.v }}
          # Contrôle et fourchette de la prévision solaire (journal) : nombre de valeurs datées du
          # jour préparé, cumuls P10 (cas défavorable) et P90 (cas favorable), heure de mise à jour.
          pv_info: >
            {% set dh = state_attr(capteur_pv, 'detailedHourly') or [] %}
            {% set ns = namespace(n=0, p10=0, p90=0) %}
            {% for e in dh %}
              {% if (e.period_start | as_datetime | as_local).date() | string == jour_cible %}
                {% set ns.n = ns.n + 1 %}
                {% set ns.p10 = ns.p10 + (e.get('pv_estimate10', 0) | float(0)) %}
                {% set ns.p90 = ns.p90 + (e.get('pv_estimate90', 0) | float(0)) %}
              {% endif %}
            {% endfor %}
            {% set m = states('sensor.solcast_pv_forecast_derniere_interrogation_de_l_api') %}
            {% set maj = (m | as_datetime(none)) if m not in ['unknown', 'unavailable', ''] else none %}
            {{ {'ok': ns.n > 0, 'valeurs': ns.n, 'p10': ns.p10 | round(1), 'p90': ns.p90 | round(1),
                'maj': (maj | as_local).strftime('%d/%m %Hh%M') if maj else none,
                'age_h': (((now() - maj).total_seconds() / 3600) | round(1)) if maj else none} }}
          calcul: >
            {% set cap_brute = states('input_number.jarvis_batterie_capacite') | float(0) %}
            {% set plancher = states('input_number.jarvis_batterie_plancher') | float(10) %}
            {% set eta = states('input_number.jarvis_batterie_rendement') | float(95) / 100 %}
            {% set p_ch = states('input_number.jarvis_batterie_puissance_charge') | float(5) %}
            {% set hp = states('input_number.jarvis_prix_hp') | float(0) %}
            {% set hc = states('input_number.jarvis_prix_hc') | float(0) %}
            {% set hc_d = states('input_datetime.jarvis_hc_debut') %}
            {% set hc_f = states('input_datetime.jarvis_hc_fin') %}
            {% set hc_d = hc_d if hc_d | regex_match('^\\d\\d:\\d\\d') else '23:00:00' %}
            {% set hc_f = hc_f if hc_f | regex_match('^\\d\\d:\\d\\d') else '06:00:00' %}
            {% set deb_min = hc_d[:2] | int * 60 + hc_d[3:5] | int %}
            {% set fin_hc_min = hc_f[:2] | int * 60 + hc_f[3:5] | int %}
            {% set h_deb = deb_min // 60 %}
            {% set h_fin = fin_hc_min // 60 %}
            {% set duree_hc = (fin_hc_min - deb_min) % 1440 %}
            {% set cap = cap_brute * (1 - plancher / 100) %}
            {% set soc = states('sensor.uhome_soc') | float(none) %}
            {% set t_batt = states('sensor.uhome_temperature_batterie') | float(none) %}
            {% set marge = states('input_number.jarvis_batterie_marge') | float(10) / 100 %}
            {% set p = profils['ouvre' if demain_ouvre else 'repos'] %}
            {% set cm = conso_mesuree if conso_mesuree is list and conso_mesuree | count == 24 else [none] * 24 %}
            {% set n_mes = cm | select('number') | list | count %}
            {% set ns = namespace(deficit=0, surplus=0, cum=0, pic=0, pic_avant=0, mini=0, h_min=none, conso=0, nuit=0, l=[]) %}
            {% for h in range(24) %}
              {% set ns.l = ns.l + [cm[h] if cm[h] is number else ((conso_jour * p[h]) if conso_jour is number else none)] %}
            {% endfor %}
            {% set conso_ok = ns.l | select('number') | list | count == 24 %}
            {% if conso_ok %}
              {# Consommation d'ici la fin des heures creuses (en cours de nuit : à partir de maintenant). #}
              {% set now_min = now().hour * 60 + now().minute %}
              {% set ecoule = (now_min - deb_min) % 1440 %}
              {% set ecoule = ecoule if ecoule < duree_hc else 0 %}
              {% for i in range((duree_hc + 59) // 60) %}
                {% set h = (h_deb + i) % 24 %}
                {% set part = [0, [1, (60 * (i + 1) - ecoule) / 60, (duree_hc - 60 * i) / 60] | min] | max %}
                {% set ns.nuit = ns.nuit + ns.l[h] * part %}
              {% endfor %}
              {% for h in range(h_fin, h_deb if h_deb > h_fin else 24) %}
                {% set l = ns.l[h] %}
                {% set v = pv_h[h] %}
                {% set ns.conso = ns.conso + l %}
                {% set d = [l - v, 0] | max %}
                {% set s = [v - l, 0] | max %}
                {% set ns.deficit = ns.deficit + d %}
                {% set ns.surplus = ns.surplus + s %}
                {% set ns.cum = ns.cum + eta * s - d / eta %}
                {% set ns.pic = [ns.pic, ns.cum] | max %}
                {% if ns.cum < ns.mini %}
                  {% set ns.mini = ns.cum %}
                  {% set ns.h_min = h %}
                  {% set ns.pic_avant = ns.pic %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {# De la fin de la plage (15 min avant la fin des HC) à la fin des HC, la batterie alimente la maison. #}
            {% set talon = (ns.l[(h_fin - 1) % 24] * 0.25 / eta) if conso_ok else 0 %}
            {% set besoin = ([0, -ns.mini] | max + (talon if ns.mini < 0 else 0)) * (1 + marge) %}
            {% set relais = (ns.h_min + 1) if ns.h_min is not none else h_fin %}
            {% set relais_txt = ("jusqu'aux heures creuses de " ~ h_deb ~ 'h') if relais >= h_deb else ("jusqu'au relais du solaire vers " ~ relais ~ 'h') %}
            {# Le stock du matin n'empêche le solaire de charger que s'il est encore là au moment
               d'un pic de remplissage : seul compte le pic atteint AVANT le point le plus bas. #}
            {% set place = [0, cap - ns.pic_avant] | max %}
            {% set cible = [besoin, place, cap] | min %}
            {% set stock = [0, ((soc if soc is number else plancher) - plancher) / 100 * cap_brute] | max %}
            {% set drain = ns.nuit / eta %}
            {% set stock_restant = [0, stock - drain] | max %}
            {% set ns2 = namespace(recharge=0, maintien=false, motif='ok') %}
            {% if not demain_ouvre %}{% set ns2.motif = 'Demain non ouvré : tout est en heures creuses, pas de recharge.' %}
            {% elif cap_brute <= 0 %}{% set ns2.motif = 'Capacité de la batterie non renseignée : pas de recharge.' %}
            {% elif not conso_ok %}{% set ns2.motif = 'Consommation inconnue (heures sans mesure et consommation journalière par défaut non renseignée) : pas de recharge (repli sûr).' %}
            {% elif soc is not number %}{% set ns2.motif = 'SOC batterie indisponible : pas de recharge (repli sûr).' %}
            {% elif not pv_info.ok %}{% set ns2.motif = 'Prévision solaire indisponible pour le jour préparé : pas de recharge (repli sûr).' %}
            {% elif t_batt is number and t_batt < 0 %}{% set ns2.motif = 'Batterie sous 0 °C : charge interdite.' %}
            {% elif cible <= 0.05 %}{% set ns2.motif = 'Soleil prévu suffisant dès la fin des heures creuses : pas de recharge.' %}
            {% elif stock_restant >= cible %}
              {% set ns2.motif = 'Stock actuel suffisant, même après la nuit, pour les ' ~ (besoin | round(1)) ~ ' kWh à couvrir ' ~ relais_txt ~ ' : pas de recharge.' %}
            {% elif hp * eta * eta <= hc %}
              {% set ns2.motif = 'Écart HP/HC insuffisant : pas de recharge.' %}
            {% else %}
              {% set ns2.recharge = (cible - stock_restant) / eta %}
              {% set ns2.maintien = ns2.recharge > 0 %}
            {% endif %}
            {% set recharge = ns2.recharge %}
            {# Plage en fin d'heures creuses : fin 15 min avant leur fin, durée majorée de 10 %. #}
            {% set fin_ch = (fin_hc_min - 15) % 1440 %}
            {% set dispo = (fin_ch - deb_min) % 1440 %}
            {% set duree_min = [((recharge / p_ch * 60 * 1.1) | round(0, 'ceil') | int) if (recharge > 0 and p_ch > 0) else 0, dispo] | min %}
            {% set debut_min = (fin_ch - duree_min) % 1440 %}
            {% set debut = '%02d%02d' | format(debut_min // 60, debut_min % 60) %}
            {% set fin_txt = '%02d%02d' | format(fin_ch // 60, fin_ch % 60) %}
            {% if duree_min == 0 %}{% set plages = [] %}
            {% elif debut_min > fin_ch %}
              {% set plages = [{'debut': debut, 'fin': '2359'}, {'debut': '0000', 'fin': fin_txt}] %}
            {% else %}
              {% set plages = [{'debut': debut, 'fin': fin_txt}] %}
            {% endif %}
            {% set avant = (debut_min - deb_min) % 1440 %}
            {% set reeval_min = (debut_min - 60) % 1440 %}
            {% set reeval = ('%02d:%02d' | format(reeval_min // 60, reeval_min % 60)) if (duree_min > 0 and avant >= 65) else none %}
            {% set limite = (' (limitée à la capacité de la batterie)' if cap <= place else ' (limitée pour laisser de la place au solaire)') if [place, cap] | min < besoin else '' %}
            {% if ns2.motif == 'ok' and recharge > 0 %}
              {% set ns2.motif = 'Recharge de ' ~ (recharge | round(1)) ~ ' kWh entre ' ~ debut[:2] ~ 'h' ~ debut[2:] ~ ' et ' ~ fin_txt[:2] ~ 'h' ~ fin_txt[2:] ~ limite ~ ' pour couvrir ' ~ (besoin | round(1)) ~ ' kWh ' ~ relais_txt ~ ' (consommation mesurée sur ' ~ n_mes ~ ' h sur 24, marge ' ~ (marge * 100) | round(0) | int ~ ' %).' %}
            {% endif %}
            {{ {
              'recharge_kwh': recharge | round(2),
              'cible_kwh': cible | round(2),
              'stock_kwh': stock | round(2),
              'besoin_kwh': besoin | round(2),
              'relais_h': relais,
              'place_kwh': place | round(2),
              'conso_nuit_kwh': ns.nuit | round(1),
              'conso_prevue_hp_kwh': ns.conso | round(1),
              'solaire_prevu_kwh': (pv_h | sum) | round(1),
              'deficit_hp_kwh': ns.deficit | round(1),
              'surplus_solaire_kwh': ns.surplus | round(1),
              'duree_h': (duree_min / 60) | round(2),
              'gain_estime_eur': (recharge * (eta * eta * hp - hc)) | round(2),
              'heures_mesurees': n_mes,
              'stock_apres_nuit_kwh': stock_restant | round(2),
              'maintien': ns2.maintien,
              'plages': plages,
              'plan_debut': plages[0].debut if plages else none,
              'plan_fin': plages[-1].fin if plages else none,
              'reevaluation': reeval,
              'calcul_valide': ns2.motif[:10] not in ['Consommati', 'SOC batter', 'Capacité d', 'Prévision '],
              'borne_capacite': besoin >= cap and cap > 0,
              'justification': ns2.motif
            } }}
    sensor:
      - name: "Jarvis recharge réseau prévue"
        unique_id: jarvis_recharge_reseau_prevue
        unit_of_measurement: kWh
        device_class: energy
        icon: mdi:battery-clock
        state: "{{ calcul.recharge_kwh }}"
        attributes:
          pour_le: "{{ demain }}"
          jour_ouvre: "{{ demain_ouvre }}"
          conso_prevue_jour_kwh: "{{ conso_jour }}"
          conso_prevue_hp_kwh: "{{ calcul.conso_prevue_hp_kwh }}"
          solaire_prevu_kwh: "{{ calcul.solaire_prevu_kwh }}"
          deficit_hp_kwh: "{{ calcul.deficit_hp_kwh }}"
          surplus_solaire_kwh: "{{ calcul.surplus_solaire_kwh }}"
          besoin_kwh: "{{ calcul.besoin_kwh }}"
          relais_h: "{{ calcul.relais_h }}"
          conso_nuit_kwh: "{{ calcul.conso_nuit_kwh }}"
          stock_apres_nuit_kwh: "{{ calcul.stock_apres_nuit_kwh }}"
          heures_mesurees: "{{ calcul.heures_mesurees }}"
          cible_stock_6h_kwh: "{{ calcul.cible_kwh }}"
          stock_actuel_kwh: "{{ calcul.stock_kwh }}"
          duree_h: "{{ calcul.duree_h }}"
          gain_estime_eur: "{{ calcul.gain_estime_eur }}"
          justification: "{{ calcul.justification }}"
          maintien: "{{ calcul.maintien }}"
          calcul_valide: "{{ calcul.calcul_valide }}"
          reevaluation: "{{ calcul.reevaluation }}"
          plan_debut: "{{ calcul.plan_debut }}"
          plages: "{{ calcul.plages }}"
          plan_fin: "{{ calcul.plan_fin }}"
          mode: "{{ 'simulation' if is_state('input_boolean.jarvis_mode_simulation', 'on') else 'réel' }}"
          solaire_p10_kwh: "{{ pv_info.p10 }}"
          solaire_p90_kwh: "{{ pv_info.p90 }}"
          prevision_solaire_maj: "{{ pv_info.maj }}"
          prevision_solaire_age_h: "{{ pv_info.age_h }}"
          prevision_solaire_ok: "{{ pv_info.ok }}"
          batterie_pleine_de_toute_facon: "{{ calcul.borne_capacite }}"
          methode_conso: "Moyenne pondérée des 7 derniers jours (même type de jour en priorité)"

  - sensor:
      - name: "Jarvis coût réseau du jour"
        unique_id: jarvis_cout_reseau_jour
        unit_of_measurement: "EUR"
        device_class: monetary
        state: >
          {{ (states('sensor.jarvis_soutirage_jour_hp') | float(0) * states('input_number.jarvis_prix_hp') | float(0)
            + states('sensor.jarvis_soutirage_jour_hc') | float(0) * states('input_number.jarvis_prix_hc') | float(0)) | round(2) }}

  # ---------------------------------------------------------------------------
  # Gain réel (v7) : 25 min après le début des heures creuses, Jarvis compare le coût réel des
  # 24 dernières heures (soutirage mesuré × prix de l'heure - injection × prix de revente) au coût
  # qu'aurait eu la maison en autoconsommation simple, simulée heure par heure avec la consommation
  # et la production mesurées, en partant du même stock. L'écart de stock en fin de fenêtre est
  # valorisé au prix des heures creuses × rendement (il sert la nuit suivante).
  # Les jours sans recharge (week-ends), le gain doit rester proche de 0 : l'écart mesure alors
  # l'imprécision de la simulation horaire. Recalcul manuel : événement « jarvis_calcul_gain ».
  # Statistiques utilisées : sensor.uhome_puissance_maison, sensor.uhome_puissance_mppt_1 et _2,
  # sensor.uhome_puissance_reseau (moyennes horaires), sensor.uhome_soc (stock en début et fin de
  # fenêtre), sensor.uhome_soutirage_reseau_total (soutirage par heure).
  # ---------------------------------------------------------------------------
  - triggers:
      - trigger: time
        at:
          entity_id: input_datetime.jarvis_hc_debut
          offset: "00:25:00"
      - trigger: event
        event_type: jarvis_calcul_gain
    actions:
      - variables:
          # Fenêtre de 24 h finissant à l'heure ronde du début des heures creuses (ex. 23h-23h).
          fin_fenetre: >
            {% set d = states('input_datetime.jarvis_hc_debut') %}
            {% set hd = d[:2] | int(23) if d | regex_match('^\\d\\d:') else 23 %}
            {% set f = now().replace(hour=hd, minute=0, second=0, microsecond=0) %}
            {{ (f if now() >= f + timedelta(minutes=20) else f - timedelta(days=1)).isoformat() }}
          debut_fenetre: "{{ ((fin_fenetre | as_datetime) - timedelta(days=1)).isoformat() }}"
      - action: workday.check_date
        target: { entity_id: binary_sensor.workday_sensor }
        data:
          check_date: "{{ (debut_fenetre | as_datetime).date() | string }}"
        response_variable: jour_debut
      - action: workday.check_date
        target: { entity_id: binary_sensor.workday_sensor }
        data:
          check_date: "{{ (fin_fenetre | as_datetime).date() | string }}"
        response_variable: jour_fin
      - action: recorder.get_statistics
        continue_on_error: true
        data:
          start_time: "{{ ((debut_fenetre | as_datetime) - timedelta(hours=1)).isoformat() }}"
          end_time: "{{ fin_fenetre }}"
          statistic_ids:
            - sensor.uhome_puissance_maison
            - sensor.uhome_puissance_mppt_1
            - sensor.uhome_puissance_mppt_2
            - sensor.uhome_puissance_reseau
            - sensor.uhome_soc
          period: hour
          types: [mean]
        response_variable: moyennes
      - action: recorder.get_statistics
        continue_on_error: true
        data:
          start_time: "{{ debut_fenetre }}"
          end_time: "{{ fin_fenetre }}"
          statistic_ids: [sensor.uhome_soutirage_reseau_total]
          period: hour
          types: [change]
        response_variable: compteurs
      - variables:
          gain: >
            {% set cap_brute = states('input_number.jarvis_batterie_capacite') | float(0) %}
            {% set plancher = states('input_number.jarvis_batterie_plancher') | float(10) %}
            {% set eta = states('input_number.jarvis_batterie_rendement') | float(95) / 100 %}
            {% set hp = states('input_number.jarvis_prix_hp') | float(0) %}
            {% set hc = states('input_number.jarvis_prix_hc') | float(0) %}
            {% set inj = states('input_number.jarvis_prix_injection') | float(0) %}
            {% set base = is_state('input_select.jarvis_type_tarif', 'Base') %}
            {% set hc_we = is_state('input_boolean.jarvis_hc_jours_non_ouvres', 'on') %}
            {% set hc_d = states('input_datetime.jarvis_hc_debut') %}
            {% set hc_f = states('input_datetime.jarvis_hc_fin') %}
            {% set hc_d = hc_d if hc_d | regex_match('^\\d\\d:\\d\\d') else '23:00:00' %}
            {% set hc_f = hc_f if hc_f | regex_match('^\\d\\d:\\d\\d') else '06:00:00' %}
            {% set dm = hc_d[:2] | int * 60 + hc_d[3:5] | int %}
            {% set fm = hc_f[:2] | int * 60 + hc_f[3:5] | int %}
            {% set cap = cap_brute * (1 - plancher / 100) %}
            {% set deb = debut_fenetre | as_datetime %}
            {% set fin = fin_fenetre | as_datetime %}
            {% set t0 = as_timestamp(deb) | int %}
            {% set n = ((as_timestamp(fin) - as_timestamp(deb)) / 3600) | round(0) | int %}
            {% set ouvre_deb = jour_debut['binary_sensor.workday_sensor'].workday | default(true) %}
            {% set ouvre_fin = jour_fin['binary_sensor.workday_sensor'].workday | default(true) %}
            {% set date_fin = fin.date() | string %}
            {% set st = moyennes.statistics if (moyennes is defined and moyennes is mapping and 'statistics' in moyennes) else {} %}
            {% set sc = compteurs.statistics if (compteurs is defined and compteurs is mapping and 'statistics' in compteurs) else {} %}
            {% set rL = st.get('sensor.uhome_puissance_maison', []) %}
            {% set r1 = st.get('sensor.uhome_puissance_mppt_1', []) %}
            {% set r2 = st.get('sensor.uhome_puissance_mppt_2', []) %}
            {% set rR = st.get('sensor.uhome_puissance_reseau', []) %}
            {% set rS = st.get('sensor.uhome_soc', []) %}
            {% set rI = sc.get('sensor.uhome_soutirage_reseau_total', []) %}
            {% set mL = dict(zip(rL | map(attribute='start') | map('as_timestamp') | map('int') | list, rL | map(attribute='mean') | list)) %}
            {% set m1 = dict(zip(r1 | map(attribute='start') | map('as_timestamp') | map('int') | list, r1 | map(attribute='mean') | list)) %}
            {% set m2 = dict(zip(r2 | map(attribute='start') | map('as_timestamp') | map('int') | list, r2 | map(attribute='mean') | list)) %}
            {% set mR = dict(zip(rR | map(attribute='start') | map('as_timestamp') | map('int') | list, rR | map(attribute='mean') | list)) %}
            {% set mS = dict(zip(rS | map(attribute='start') | map('as_timestamp') | map('int') | list, rS | map(attribute='mean') | list)) %}
            {% set mI = dict(zip(rI | map(attribute='start') | map('as_timestamp') | map('int') | list, rI | map(attribute='change') | list)) %}
            {% set soc0 = mS.get(t0 - 3600) %}
            {% set soc1 = mS.get(t0 + 3600 * (n - 1)) %}
            {% set s_reel0 = [0, ((soc0 if soc0 is number else plancher) - plancher) / 100 * cap_brute] | max %}
            {% set s_reel1 = [0, ((soc1 if soc1 is number else plancher) - plancher) / 100 * cap_brute] | max %}
            {% set ns = namespace(ok=0, s=s_reel0, cout_reel=0, cout_auto=0, achat=0, achat_hp=0, injection=0,
                                  achat_auto=0, achat_hp_auto=0, injection_auto=0) %}
            {% for i in range(n) %}
              {% set ts = t0 + 3600 * i %}
              {% set loc = ts | timestamp_custom('%Y-%m-%d %H', true) %}
              {% set m0 = loc[11:13] | int * 60 %}
              {# Part de l'heure en heures creuses (plage qui peut passer minuit). #}
              {% if dm > fm %}
                {% set frac = ([0, [m0 + 60, 1440] | min - [m0, dm] | max] | max + [0, [m0 + 60, fm] | min - m0] | max) / 60 %}
              {% else %}
                {% set frac = [0, [m0 + 60, fm] | min - [m0, dm] | max] | max / 60 %}
              {% endif %}
              {% set ouvre = ouvre_fin if loc[:10] == date_fin else ouvre_deb %}
              {% set frac = 1 if (hc_we and not ouvre) else frac %}
              {% set prix = hp if base else hp * (1 - frac) + hc * frac %}
              {% set L = mL.get(ts) %}
              {% set p1 = m1.get(ts) %}
              {% set p2 = m2.get(ts) %}
              {% set I = mI.get(ts) %}
              {% set R = mR.get(ts) %}
              {# La nuit, l'onduleur n'envoie pas de puissance MPPT : une heure sans valeur compte pour 0. #}
              {% if L is number and I is number %}
                {% set ns.ok = ns.ok + 1 %}
                {% set L = [0, L] | max / 1000 %}
                {% set P = ([0, p1 if p1 is number else 0] | max + [0, p2 if p2 is number else 0] | max) / 1000 %}
                {% set I = [0, I] | max %}
                {% set E = [0, I - R / 1000] | max if R is number else 0 %}
                {% set ns.cout_reel = ns.cout_reel + I * prix - E * inj %}
                {% set ns.achat = ns.achat + I %}
                {% set ns.achat_hp = ns.achat_hp + I * (0 if base else 1 - frac) %}
                {% set ns.injection = ns.injection + E %}
                {# Autoconsommation simple simulée : le surplus charge la batterie, le déficit la décharge. #}
                {% set net = P - L %}
                {% if net >= 0 %}
                  {% set c = [net, (cap - ns.s) / eta] | min %}
                  {% set ns.s = ns.s + c * eta %}
                  {% set ns.injection_auto = ns.injection_auto + net - c %}
                  {% set ns.cout_auto = ns.cout_auto - (net - c) * inj %}
                {% else %}
                  {% set d = [-net, ns.s * eta] | min %}
                  {% set ns.s = ns.s - d / eta %}
                  {% set a = -net - d %}
                  {% set ns.achat_auto = ns.achat_auto + a %}
                  {% set ns.achat_hp_auto = ns.achat_hp_auto + a * (0 if base else 1 - frac) %}
                  {% set ns.cout_auto = ns.cout_auto + a * prix %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% set v = hc * eta %}
            {% set valide = cap_brute > 0 and soc0 is number and soc1 is number and ns.ok >= n - 1 and n > 0 %}
            {% set g = ((ns.cout_auto - v * ns.s) - (ns.cout_reel - v * s_reel1)) if valide else none %}
            {{ {
              'gain': g | round(2) if g is number else none,
              'valide': valide,
              'fenetre': deb.strftime('%d/%m %Hh') ~ ' - ' ~ fin.strftime('%d/%m %Hh'),
              'jour': date_fin,
              'jour_ouvre': ouvre_fin,
              'heures_mesurees': ns.ok,
              'heures': n,
              'cout_reel_eur': ns.cout_reel | round(2),
              'cout_autoconsommation_eur': ns.cout_auto | round(2),
              'soutirage_kwh': ns.achat | round(1),
              'soutirage_hp_kwh': ns.achat_hp | round(1),
              'injection_kwh': ns.injection | round(1),
              'soutirage_autoconsommation_kwh': ns.achat_auto | round(1),
              'soutirage_hp_autoconsommation_kwh': ns.achat_hp_auto | round(1),
              'injection_autoconsommation_kwh': ns.injection_auto | round(1),
              'stock_debut_kwh': s_reel0 | round(2),
              'stock_fin_reel_kwh': s_reel1 | round(2),
              'stock_fin_autoconsommation_kwh': ns.s | round(2),
              'valeur_stock_eur_kwh': v | round(4)
            } }}
    sensor:
      - name: "Jarvis gain réel du jour"
        unique_id: jarvis_gain_reel_jour
        unit_of_measurement: "EUR"
        device_class: monetary
        icon: mdi:piggy-bank-outline
        state: "{{ gain.gain if gain.valide else none }}"
        attributes:
          fenetre: "{{ gain.fenetre }}"
          jour: "{{ gain.jour }}"
          jour_ouvre: "{{ gain.jour_ouvre }}"
          calcul_valide: "{{ gain.valide }}"
          heures_mesurees: "{{ gain.heures_mesurees }} / {{ gain.heures }}"
          cout_reel_eur: "{{ gain.cout_reel_eur }}"
          cout_autoconsommation_simulee_eur: "{{ gain.cout_autoconsommation_eur }}"
          soutirage_kwh: "{{ gain.soutirage_kwh }}"
          soutirage_hp_kwh: "{{ gain.soutirage_hp_kwh }}"
          injection_kwh: "{{ gain.injection_kwh }}"
          soutirage_autoconsommation_kwh: "{{ gain.soutirage_autoconsommation_kwh }}"
          soutirage_hp_autoconsommation_kwh: "{{ gain.soutirage_hp_autoconsommation_kwh }}"
          injection_autoconsommation_kwh: "{{ gain.injection_autoconsommation_kwh }}"
          stock_debut_kwh: "{{ gain.stock_debut_kwh }}"
          stock_fin_reel_kwh: "{{ gain.stock_fin_reel_kwh }}"
          stock_fin_autoconsommation_kwh: "{{ gain.stock_fin_autoconsommation_kwh }}"
          mode: "{{ 'simulation' if is_state('input_boolean.jarvis_mode_simulation', 'on') else 'réel' }}"
      # Cumuls : chaque jour n'est ajouté qu'une fois (recalcul manuel sans double compte).
      - name: "Jarvis gain réel du mois"
        unique_id: jarvis_gain_reel_mois
        unit_of_measurement: "EUR"
        device_class: monetary
        icon: mdi:piggy-bank
        state: >
          {% set a = this.attributes if this is defined and this.attributes is defined else {} %}
          {% set prec = (this.state | float(0)) if a.get('mois') == gain.jour[:7] else 0 %}
          {% if gain.valide and a.get('dernier_jour') != gain.jour %}{{ (prec + gain.gain) | round(2) }}{% else %}{{ prec | round(2) }}{% endif %}
        attributes:
          mois: "{{ gain.jour[:7] }}"
          dernier_jour: >
            {% set a = this.attributes if this is defined and this.attributes is defined else {} %}
            {{ gain.jour if gain.valide else a.get('dernier_jour') }}
          jours_comptes: >
            {% set a = this.attributes if this is defined and this.attributes is defined else {} %}
            {% set n = (a.get('jours_comptes') | int(0)) if a.get('mois') == gain.jour[:7] else 0 %}
            {{ n + 1 if (gain.valide and a.get('dernier_jour') != gain.jour) else n }}
      - name: "Jarvis gain réel de l'année"
        unique_id: jarvis_gain_reel_annee
        unit_of_measurement: "EUR"
        device_class: monetary
        icon: mdi:piggy-bank
        state: >
          {% set a = this.attributes if this is defined and this.attributes is defined else {} %}
          {% set prec = (this.state | float(0)) if a.get('annee') == gain.jour[:4] else 0 %}
          {% if gain.valide and a.get('dernier_jour') != gain.jour %}{{ (prec + gain.gain) | round(2) }}{% else %}{{ prec | round(2) }}{% endif %}
        attributes:
          annee: "{{ gain.jour[:4] }}"
          dernier_jour: >
            {% set a = this.attributes if this is defined and this.attributes is defined else {} %}
            {{ gain.jour if gain.valide else a.get('dernier_jour') }}
          jours_comptes: >
            {% set a = this.attributes if this is defined and this.attributes is defined else {} %}
            {% set n = (a.get('jours_comptes') | int(0)) if a.get('annee') == gain.jour[:4] else 0 %}
            {{ n + 1 if (gain.valide and a.get('dernier_jour') != gain.jour) else n }}

automation:
  - id: jarvis_batterie_valeurs_initiales
    alias: "Jarvis · Batterie : valeurs initiales"
    description: >
      Tant que la capacité de la batterie n'est pas renseignée, place des valeurs prudentes
      (plancher 20 % = DOD d'usine de 80 %, rendement 95 %, 3 kW, marge 10 %). Renseigner
      ensuite la capacité et les valeurs réelles dans Paramètres > Entrées.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: numeric_state
        entity_id: input_number.jarvis_batterie_capacite
        below: 0.01
    actions:
      - action: input_number.set_value
        target: { entity_id: input_number.jarvis_batterie_plancher }
        data: { value: 20 }
      - action: input_number.set_value
        target: { entity_id: input_number.jarvis_batterie_marge }
        data: { value: 10 }
      - action: input_number.set_value
        target: { entity_id: input_number.jarvis_batterie_rendement }
        data: { value: 95 }
      - action: input_number.set_value
        target: { entity_id: input_number.jarvis_batterie_puissance_charge }
        data: { value: 3 }

  - id: jarvis_batterie_decision_du_soir
    alias: "Jarvis · Batterie : décision du soir (journal)"
    description: >
      Au début des heures creuses (23h), recalcule avec le SOC du moment, journalise la décision
      et sa justification. En simulation, rien d'autre. En mode réel, appelle le script
      d'application (plages en fin d'heures creuses, puis arbitrage horaire), jusqu'à 3 fois
      (début des heures creuses, +10 min, +30 min) ; alerte seulement après le dernier essai.
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.jarvis_hc_debut
    conditions:
      # Stratégie choisie dans jarvis_dynamique.yaml (facultatif) : sans ce package, l'entité
      # n'existe pas et le pilotage de nuit fonctionne comme avant.
      - condition: template
        value_template: >
          {{ states('input_select.jarvis_strategie') in ['unknown', 'unavailable', 'Heures pleines / heures creuses (calcul v7)'] }}
    actions:
      - event: jarvis_recalcul_batterie
      - delay: "00:00:20"
      - action: logbook.log
        data:
          name: "Jarvis batterie"
          entity_id: sensor.jarvis_recharge_reseau_prevue
          message: >
            [{{ state_attr('sensor.jarvis_recharge_reseau_prevue', 'mode') }}]
            {{ state_attr('sensor.jarvis_recharge_reseau_prevue', 'justification') }}
            Conso HP prévue {{ state_attr('sensor.jarvis_recharge_reseau_prevue', 'conso_prevue_hp_kwh') }} kWh,
            solaire prévu {{ state_attr('sensor.jarvis_recharge_reseau_prevue', 'solaire_prevu_kwh') }} kWh,
            tarif HP {{ states('input_number.jarvis_prix_hp') }} / HC {{ states('input_number.jarvis_prix_hc') }} €/kWh,
            gain estimé {{ state_attr('sensor.jarvis_recharge_reseau_prevue', 'gain_estime_eur') }} €.
            Fourchette solaire P10-P90 : {{ state_attr('sensor.jarvis_recharge_reseau_prevue', 'solaire_p10_kwh') }} à {{ state_attr('sensor.jarvis_recharge_reseau_prevue', 'solaire_p90_kwh') }} kWh
            (prévision du {{ state_attr('sensor.jarvis_recharge_reseau_prevue', 'prevision_solaire_maj') }}) ;
            consommation mesurée sur {{ state_attr('sensor.jarvis_recharge_reseau_prevue', 'heures_mesurees') }} h sur 24 (moyenne pondérée).
            {% if state_attr('sensor.jarvis_recharge_reseau_prevue', 'batterie_pleine_de_toute_facon') %}Besoin supérieur à la capacité : batterie remplie quelle que soit la prévision.{% endif %}
            {% set pl = state_attr('sensor.jarvis_recharge_reseau_prevue', 'plages') or [] %}
            {% if state_attr('sensor.jarvis_recharge_reseau_prevue', 'maintien') %}Arbitrage horaire pendant les heures creuses{% if pl %}, plages {% for x in pl %}{{ x.debut }}-{{ x.fin }} {% endfor %}{% endif %}.{% endif %}
      - if:
          - condition: state
            entity_id: input_boolean.jarvis_mode_simulation
            state: "off"
        then:
          # Jusqu'à 3 essais : au début des heures creuses, puis 10 et 30 min après. Un échec
          # passager (onduleur qui répond hors délai, cloud injoignable) ne coûte plus la nuit.
          # Le script est rejouable : les réglages déjà en place ne sont pas renvoyés.
          - variables:
              programme: false
              essais: [0, 10, 30]
          - repeat:
              sequence:
                - delay: >
                    {% set cible = as_local(trigger.now) + timedelta(minutes=essais[repeat.index - 1]) %}
                    {{ [0, (cible - now()).total_seconds()] | max | int }}
                - action: script.jarvis_batterie_appliquer
                  continue_on_error: true
                  response_variable: resultat
                - variables:
                    programme: "{{ ((resultat | default({})) or {}).get('ok', false) == true }}"
                - if:
                    - condition: template
                      value_template: >
                        {{ not programme and repeat.index < essais | count
                           and state_attr('sensor.jarvis_recharge_reseau_prevue', 'maintien') == true
                           and is_state('input_boolean.jarvis_mode_simulation', 'off') }}
                  then:
                    - action: logbook.log
                      data:
                        name: "Jarvis batterie"
                        entity_id: sensor.jarvis_recharge_reseau_prevue
                        message: >
                          [réel] Essai {{ repeat.index }} de programmation non abouti ; nouvel essai à
                          {{ (as_local(trigger.now) + timedelta(minutes=essais[repeat.index])).strftime('%Hh%M') }}.
              until:
                - condition: template
                  value_template: >
                    {{ programme
                       or repeat.index >= essais | count
                       or state_attr('sensor.jarvis_recharge_reseau_prevue', 'maintien') != true
                       or is_state('input_boolean.jarvis_mode_simulation', 'on') }}
          - if:
              - condition: template
                value_template: >
                  {{ state_attr('sensor.jarvis_recharge_reseau_prevue', 'maintien') == true
                     and is_state('input_boolean.jarvis_mode_simulation', 'off')
                     and not programme }}
            then:
              - action: script.jarvis_notifier
                data:
                  niveau: a_surveiller
                  titre: "Recharge de nuit non programmée"
                  message: >
                    La recharge prévue ({{ states('sensor.jarvis_recharge_reseau_prevue') }} kWh) n'a pas pu être
                    programmée sur l'onduleur après {{ essais | count }} essais. Il reste en autoconsommation.
                    Voir le journal de Home Assistant.

  - id: jarvis_batterie_reevaluation
    alias: "Jarvis · Batterie : réévaluation 1 h avant la recharge"
    description: >
      Recalcule avec le SOC et la prévision du moment, et ajuste la plage de charge (la fin reste
      à 5h45). En simulation, journalise seulement. Une prévision ou un SOC indisponible ne
      modifie rien : la plage programmée à 23h est conservée.
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.jarvis_batterie_reevaluation
    conditions:
      - condition: state
        entity_id: input_boolean.jarvis_batterie_plan_actif
        state: "on"
      - condition: template
        value_template: >
          {{ states('input_select.jarvis_strategie') in ['unknown', 'unavailable', 'Heures pleines / heures creuses (calcul v7)'] }}
    actions:
      - event: jarvis_recalcul_batterie
      - delay: "00:00:20"
      - variables:
          valide: "{{ state_attr('sensor.jarvis_recharge_reseau_prevue', 'calcul_valide') == true }}"
          plages: "{{ state_attr('sensor.jarvis_recharge_reseau_prevue', 'plages') or [] }}"
      - action: logbook.log
        data:
          name: "Jarvis batterie"
          entity_id: sensor.jarvis_recharge_reseau_prevue
          message: >
            [{{ state_attr('sensor.jarvis_recharge_reseau_prevue', 'mode') }}] Réévaluation :
            SOC {{ states('sensor.uhome_soc') }} %, {{ state_attr('sensor.jarvis_recharge_reseau_prevue', 'justification') }}
            Prévision solaire du {{ state_attr('sensor.jarvis_recharge_reseau_prevue', 'prevision_solaire_maj') }}
            (P10-P90 : {{ state_attr('sensor.jarvis_recharge_reseau_prevue', 'solaire_p10_kwh') }} à {{ state_attr('sensor.jarvis_recharge_reseau_prevue', 'solaire_p90_kwh') }} kWh).
            {% if not valide %}Calcul incomplet : plage programmée conservée.{% endif %}
      - if:
          - condition: state
            entity_id: input_boolean.jarvis_mode_simulation
            state: "off"
          - condition: template
            value_template: "{{ valide }}"
        then:
          - action: ucaness.definir_plages_charge
            continue_on_error: true
            data:
              plages: "{{ plages }}"
            response_variable: ajustement
          - if:
              - condition: template
                value_template: "{{ not ((ajustement | default({})) or {}).get('confirme', false) }}"
            then:
              - action: script.jarvis_notifier
                data:
                  niveau: a_surveiller
                  titre: "Réévaluation de la recharge non appliquée"
                  message: >
                    La plage de charge n'a pas pu être ajustée ; celle programmée à 23h reste en place.
                    Voir le journal de Home Assistant.

  - id: jarvis_batterie_retour_autoconsommation
    alias: "Jarvis · Batterie : retour en autoconsommation après la recharge"
    description: "2 min avant la fin des heures creuses, et contrôle de secours 15 min après."
    mode: single
    triggers:
      - trigger: time
        at:
          entity_id: input_datetime.jarvis_hc_fin
          offset: "-00:02:00"
      - trigger: time
        at:
          entity_id: input_datetime.jarvis_hc_fin
          offset: "00:15:00"
    conditions:
      - condition: state
        entity_id: input_boolean.jarvis_batterie_plan_actif
        state: "on"
    actions:
      - action: script.jarvis_batterie_retour_autoconsommation
        continue_on_error: true
      - if:
          - condition: state
            entity_id: input_boolean.jarvis_batterie_plan_actif
            state: "on"
        then:
          - delay: "00:05:00"
          - action: script.jarvis_batterie_retour_autoconsommation
            continue_on_error: true
      - if:
          - condition: state
            entity_id: input_boolean.jarvis_batterie_plan_actif
            state: "on"
        then:
          - action: script.jarvis_notifier
            data:
              niveau: a_surveiller
              titre: "Batterie restée en arbitrage horaire"
              message: >
                Le retour en autoconsommation a échoué deux fois. Hors plage, la batterie ne sert pas :
                remettre le mode Autoconsommation depuis le portail UCANESS.

  - id: jarvis_batterie_journal_gain_reel
    alias: "Jarvis · Batterie : journal du gain réel"
    description: >
      Inscrit chaque soir au journal le gain réel des 24 dernières heures face à
      l'autoconsommation simple (calculé 25 min après le début des heures creuses).
    mode: single
    triggers:
      - trigger: time
        at:
          entity_id: input_datetime.jarvis_hc_debut
          offset: "00:27:00"
    actions:
      - action: logbook.log
        data:
          name: "Jarvis batterie"
          entity_id: sensor.jarvis_gain_reel_du_jour
          message: >
            {% set e = 'sensor.jarvis_gain_reel_du_jour' %}
            {% if state_attr(e, 'calcul_valide') %}
            Gain réel ({{ state_attr(e, 'fenetre') }}) : {{ states(e) }} € face à l'autoconsommation simple
            (coût réel {{ state_attr(e, 'cout_reel_eur') }} €, autoconsommation simulée {{ state_attr(e, 'cout_autoconsommation_simulee_eur') }} € ;
            achats HP {{ state_attr(e, 'soutirage_hp_kwh') }} kWh contre {{ state_attr(e, 'soutirage_hp_autoconsommation_kwh') }} kWh).
            Cumul du mois {{ states('sensor.jarvis_gain_reel_du_mois') }} €, de l'année {{ states('sensor.jarvis_gain_reel_de_l_annee') }} €.
            {% else %}
            Gain réel ({{ state_attr(e, 'fenetre') }}) non calculé : mesures incomplètes ({{ state_attr(e, 'heures_mesurees') }} h).
            {% endif %}

  - id: jarvis_solcast_mises_a_jour
    alias: "Jarvis · Solcast : mises à jour de la prévision"
    description: >
      Optionnel : actif seulement si « Solcast : mises à jour pilotées par Jarvis » est allumé,
      avec la mise à jour automatique de l'intégration Solcast coupée. Trois mises à jour de jour
      (lever du soleil + 15 min, 13h, coucher - 45 min) et une 20 min avant la réévaluation de
      nuit quand une recharge est programmée. Chaque mise à jour n'est lancée que s'il reste au
      moins 2 appels dans le quota du jour. Exemple : 2 toitures et 10 appels = 3 mises à jour de
      jour (6) + 1 de nuit (2) + valeurs réelles estimées de minuit pour l'amortissement automatique (2).
    mode: queued
    triggers:
      - trigger: sun
        event: sunrise
        offset: "00:15:00"
        id: jour
      - trigger: time
        at: "13:00:00"
        id: jour
      - trigger: sun
        event: sunset
        offset: "-00:45:00"
        id: jour
      - trigger: time
        at:
          entity_id: input_datetime.jarvis_batterie_reevaluation
          offset: "-00:20:00"
        id: nuit
    conditions:
      - condition: state
        entity_id: input_boolean.jarvis_solcast_pilote
        state: "on"
      - condition: template
        value_template: >
          {{ states('sensor.solcast_pv_forecast_limite_api') | int(0)
             - states('sensor.solcast_pv_forecast_api_utilisee') | int(99) >= 2 }}
      - condition: template
        value_template: "{{ trigger.id == 'jour' or is_state('input_boolean.jarvis_batterie_plan_actif', 'on') }}"
    actions:
      - action: solcast_solar.update_forecasts
        continue_on_error: true
      - action: logbook.log
        data:
          name: "Jarvis batterie"
          entity_id: sensor.jarvis_recharge_reseau_prevue
          message: >
            Prévision Solcast mise à jour ({{ 'avant la réévaluation de nuit' if trigger.id == 'nuit' else 'mise à jour de jour' }}) ;
            appels utilisés {{ states('sensor.solcast_pv_forecast_api_utilisee') }} / {{ states('sensor.solcast_pv_forecast_limite_api') }}.

script:
  jarvis_batterie_appliquer:
    alias: "Jarvis · Batterie : programmer la recharge de nuit"
    description: >
      Programme les plages de charge calculées (ou les vide si la batterie doit seulement être
      gardée en réserve), puis passe en arbitrage horaire. S'arrête au premier refus ou si
      l'onduleur ne confirme pas (le mode n'est alors pas changé). Ne fait rien en simulation
      ni si le calcul ne demande aucune action.
    mode: single
    sequence:
      - condition: state
        entity_id: input_boolean.jarvis_mode_simulation
        state: "off"
      - variables:
          maintien: "{{ state_attr('sensor.jarvis_recharge_reseau_prevue', 'maintien') == true }}"
          plages: "{{ state_attr('sensor.jarvis_recharge_reseau_prevue', 'plages') or [] }}"
          # « HH:MM » : un attribut « 2328 » est relu comme un nombre, d'où la remise en forme.
          fin: >
            {% set f = state_attr('sensor.jarvis_recharge_reseau_prevue', 'plan_fin') %}
            {% set f = ('%04d' | format(f | int)) if f is number else (f if f is string else '') %}
            {% set f = f if f | length == 4 else states('input_datetime.jarvis_hc_debut')[:5] | replace(':', '') %}
            {{ f[:2] ~ ':' ~ f[2:] }}
          retour: "{{ states('input_datetime.jarvis_hc_fin')[:5] }}"
          reeval: "{{ state_attr('sensor.jarvis_recharge_reseau_prevue', 'reevaluation') }}"
          mode_avant: "{{ states('sensor.uhome_mode') }}"
      - condition: template
        value_template: "{{ maintien and fin | length == 5 }}"
      - condition: template
        value_template: "{{ plages | count == 0 or is_state('binary_sensor.uhome_temperature_hors_plage', 'off') }}"
      - action: ucaness.definir_plages_charge
        data:
          plages: "{{ plages }}"
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.jarvis_batterie_fin_plan }
        data:
          time: "{{ fin }}:00"
      - if:
          - condition: template
            value_template: "{{ reeval is string and reeval | length == 5 }}"
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.jarvis_batterie_reevaluation }
            data:
              time: "{{ reeval }}:00"
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.jarvis_batterie_plan_actif }
      - action: ucaness.definir_mode
        data:
          mode: arbitrage_horaire
      - wait_template: "{{ states('sensor.uhome_mode') not in [mode_avant, 'unknown', 'unavailable'] }}"
        timeout: "00:08:00"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ wait.completed }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.jarvis_mode_attendu }
            data:
              value: "{{ states('sensor.uhome_mode') }}"
      - action: logbook.log
        data:
          name: "Jarvis batterie"
          entity_id: sensor.jarvis_recharge_reseau_prevue
          message: >
            [réel] Consigne envoyée et confirmée : {% if plages %}plages {% for x in plages %}{{ x.debut }}-{{ x.fin }} {% endfor %}{% else %}aucune plage (réserve seule){% endif %}
            puis arbitrage horaire (batterie en réserve) ; {% if reeval is string %}réévaluation à {{ reeval }} ; {% endif %}retour en autoconsommation 2 min avant {{ retour }}.
            Mode affiché : {{ states('sensor.uhome_mode') }}.
      - variables:
          resultat:
            ok: true
            plages: "{{ plages }}"
            fin: "{{ fin }}"
      - stop: "Recharge de nuit programmée"
        response_variable: resultat

  jarvis_batterie_retour_autoconsommation:
    alias: "Jarvis · Batterie : retour en autoconsommation"
    mode: single
    sequence:
      - action: ucaness.definir_mode
        data:
          mode: autoconsommation
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.jarvis_batterie_plan_actif }
      - wait_template: "{{ is_state('sensor.uhome_mode', 'Match Load Mode') }}"
        timeout: "00:08:00"
        continue_on_timeout: true
      - action: input_text.set_value
        target: { entity_id: input_text.jarvis_mode_attendu }
        data:
          value: "Match Load Mode"
      - action: logbook.log
        data:
          name: "Jarvis batterie"
          entity_id: sensor.jarvis_recharge_reseau_prevue
          message: "[réel] Retour en autoconsommation confirmé. Mode affiché : {{ states('sensor.uhome_mode') }}."
